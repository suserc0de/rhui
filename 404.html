<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found — RHUI Documentation</title>
  <meta name="robots" content="noindex, follow">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#6366f1', 600: '#4f46e5' },
            dark: { 900: '#0b0f19', 950: '#030712' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/rhui/assets/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-dark-900 text-slate-200 antialiased min-h-screen flex flex-col justify-between items-center px-4">
  <div class="h-16"></div>

  <div class="max-w-md w-full text-center space-y-6">
    <div class="inline-flex p-4 rounded-2xl bg-brand-500/10 border border-brand-500/20 text-brand-400">
      <i data-lucide="compass" class="w-12 h-12"></i>
    </div>
    <h1 class="text-6xl font-extrabold text-white tracking-tight">404</h1>
    <h2 class="text-xl font-bold text-slate-300">Page Not Found</h2>
    <p class="text-slate-400 text-sm">
      The documentation page you are looking for does not exist or has been moved to another section.
    </p>

    <div class="pt-4 flex flex-col sm:flex-row gap-3 justify-center">
      <a href="/rhui/" class="inline-flex items-center justify-center px-5 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-semibold text-sm transition-all shadow-lg shadow-brand-500/25">
        <i data-lucide="home" class="w-4 h-4 mr-2"></i> Return Home
      </a>
      <a href="/rhui/getting-started/" class="inline-flex items-center justify-center px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-sm transition-all border border-slate-700">
        <i data-lucide="book-open" class="w-4 h-4 mr-2"></i> Read Docs
      </a>
    </div>
  </div>

  <footer class="py-10 text-xs text-slate-500 text-center">
    © 2026 RHUI Template Engine.
  </footer>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
